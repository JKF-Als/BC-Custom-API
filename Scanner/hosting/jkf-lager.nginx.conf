# nginx-site til scanner-appen JKF Lager.
# Placering på serveren: /etc/nginx/sites-available/jkf-lager
# Aktivér:  sudo ln -s /etc/nginx/sites-available/jkf-lager /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# HTTPS:    sudo certbot --nginx -d lager.jkfuniverse.com
#           (certbot tilføjer selv listen 443 + certifikat og omdirigering fra http)
#
# Appen er kun statiske filer. Scannerne kalder selv Business Central, så her er
# ingen proxy og ingen backend.

server {
    listen 80;
    listen [::]:80;
    server_name lager.jkfuniverse.com;

    root /var/www/jkf-lager;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Appens egne filer må ikke caches hårdt, ellers får scannerne ikke nye versioner.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location ~* \.webmanifest$ {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
